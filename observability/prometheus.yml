global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: jungle-wagering
    metrics_path: /internal/prometheus
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: [app-1:3000, app-2:3000, app-3:3000]
