
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: jungle
      POSTGRES_PASSWORD: jungle_dev
      POSTGRES_DB: jungle_wagering
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jungle -d jungle_wagering"]
      interval: 5s
      timeout: 3s
      retries: 10

  ministack:
    image: ministackorg/ministack:latest
    restart: unless-stopped
    environment:
      PERSIST_STATE: "1"
      LOG_LEVEL: INFO
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - ministack_data:/tmp/ministack-state
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:4566/_ministack/health')"
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  ministack_data:
