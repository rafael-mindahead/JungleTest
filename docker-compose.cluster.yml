# Optional three-instance demonstration with external OIDC JWT verification.
# Requires OIDC_ISSUER, OIDC_AUDIENCE and OIDC_JWKS_URI (an actual external IdP).
# Run: docker compose -f docker-compose.yml -f docker-compose.cluster.yml up -d --build
x-api: &api
  build: .
  restart: unless-stopped
  environment: &api-env
    NODE_ENV: production
    PORT: "3000"
    DB_HOST: postgres
    DB_PORT: "5432"
    DB_NAME: jungle_wagering
    DB_USER: jungle
    DB_PASSWORD: jungle_dev
    AWS_REGION: us-east-1
    AWS_ACCESS_KEY_ID: test
    AWS_SECRET_ACCESS_KEY: test
    SQS_ENDPOINT: http://ministack:4566
    SQS_QUEUE_NAME: wager-transactions.fifo
    SQS_DLQ_NAME: wager-transactions-dlq.fifo
    SQS_EVENTS_QUEUE_NAME: wager-events.fifo
    SQS_WORKER_ENABLED: "1"
    OUTBOX_PUBLISHER_ENABLED: "1"
    REFERENCE_WORKER_ENABLED: "1"
    OIDC_ISSUER: ${OIDC_ISSUER:?Configure an external OIDC issuer}
    OIDC_AUDIENCE: ${OIDC_AUDIENCE:?Configure the expected access-token audience}
    OIDC_JWKS_URI: ${OIDC_JWKS_URI:?Configure an HTTPS JWKS URL reachable from Docker}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    ALLOW_INSECURE_TEST_AUTH: "0"
  depends_on:
    migrations:
      condition: service_completed_successfully
    queues:
      condition: service_completed_successfully
  stop_grace_period: 40s

services:
  migrations:
    build: .
    command: ["bun", "run", "db:migrate"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
  queues:
    build: .
    command: ["bun", "run", "sqs:setup"]
    environment: *api-env
    depends_on:
      ministack:
        condition: service_healthy
  app-1:
    <<: *api
    ports: ["127.0.0.1:3001:3000"]
  app-2:
    <<: *api
    ports: ["127.0.0.1:3002:3000"]
  app-3:
    <<: *api
    ports: ["127.0.0.1:3003:3000"]
